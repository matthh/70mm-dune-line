name: Weekly refresh

# Pulls a fresh copy of data/movies.json from 70mmwiki and commits it
# back to main. Vercel redeploys automatically on push.
#
# Schedule: daily at 13:00 UTC = 6:00 AM PT. Daily cadence so Ben's
# wiki edits (rating + theme backfills) propagate to the site within
# a day. Manual dispatch is available for ad-hoc refreshes.
# The commit step is a no-op when the scrape is byte-identical, so
# quiet days don't churn the repo.

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run scraper
        run: node scripts/scrape.mjs

      - name: Commit if data changed
        run: |
          git config user.name "70mm-dune-line bot"
          git config user.email "actions@github.com"
          if git diff --quiet data/movies.json; then
            echo "No data changes."
            exit 0
          fi
          # Pull total count out of the new JSON for a useful commit message.
          TOTAL=$(node -e "console.log(require('./data/movies.json').total)")
          git add data/movies.json
          git commit -m "data: weekly refresh ($TOTAL movies)"
          git push
